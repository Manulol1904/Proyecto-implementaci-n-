# Producción: MongoDB en Atlas (MONGODB_URI en .env). Redis local en el servidor.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PAYMENTS_URL: ${VITE_PAYMENTS_URL}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
      - payments

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis

  worker:
    build:
      context: ./worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - backend

  payments:
    build:
      context: ./payments
    env_file:
      - .env
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
